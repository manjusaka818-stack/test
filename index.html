<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>GitHub Pages 项目目录</title>
    <style>
      :root {
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        color: #edf1f7;
        background: #10131a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(circle at 15% 10%, rgb(74 101 255 / 18%), transparent 34rem),
          #10131a;
      }

      main {
        width: min(920px, 100%);
        margin: 0 auto;
      }

      h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); }
      .intro { max-width: 680px; color: #aeb8c7; line-height: 1.7; }

      .category {
        margin-top: 42px;
      }

      .category h2 {
        margin-bottom: 14px;
        color: #cbd4e2;
        font-size: 16px;
      }

      .card {
        display: block;
        padding: 22px;
        color: inherit;
        text-decoration: none;
        background: rgb(255 255 255 / 6%);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 16px;
        transition: 150ms ease;
      }

      .card:hover,
      .card:focus-visible {
        background: rgb(255 255 255 / 10%);
        border-color: #7790ff;
        transform: translateY(-2px);
        outline: none;
      }

      .card strong { display: block; font-size: 20px; }
      .card span { display: block; margin-top: 8px; color: #aeb8c7; line-height: 1.6; }
      .path { font-family: Consolas, monospace; color: #92a7ff !important; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>项目目录</h1>
      <p class="intro">此仓库用于集中部署多个独立网页项目。每个项目拥有自己的目录和公开地址，后续部署不会覆盖已有项目。</p>

      <section class="category">
        <h2>直播工具 / OBS</h2>
        <a class="card" href="./projects/obs-transparent-overlay/">
          <strong>OBS 透明动态覆盖层</strong>
          <span>支持文本、静态图片与 GIF，在视口边缘持续反弹，并持久保存设置与图片。</span>
          <span class="path">projects/obs-transparent-overlay/</span>
        </a>
      </section>
    </main>
  </body>
</html>
